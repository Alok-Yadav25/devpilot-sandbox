name: run-tests
run-name: run-tests ${{ inputs.job_id }}
on:
  workflow_dispatch:
    inputs:
      job_id: {required: true, type: string}
      target_repo: {required: true, type: string}
      target_ref: {required: true, type: string}
permissions:
  contents: read
concurrency:
  group: devpilot-sandbox
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate public target
        env:
          TARGET_REPO: ${{ inputs.target_repo }}
          TARGET_REF: ${{ inputs.target_ref }}
          ALLOWED_TARGET_REPOS: ${{ vars.ALLOWED_TARGET_REPOS }}
          ALLOWED_TARGET_OWNER: ${{ vars.ALLOWED_TARGET_OWNER }}
        shell: python
        run: |
          import json, os, re, urllib.request
          target = os.environ['TARGET_REPO']
          assert re.fullmatch(r'[A-Za-z0-9][A-Za-z0-9_.-]*/[A-Za-z0-9][A-Za-z0-9_.-]*', target)
          assert re.fullmatch(r'[0-9a-f]{40}', os.environ['TARGET_REF'])
          allowed = {r.strip().lower() for r in os.environ['ALLOWED_TARGET_REPOS'].split(',') if r.strip()}
          owner = os.environ.get('ALLOWED_TARGET_OWNER', '').strip().lower()
          assert target.lower() in allowed or (owner and target.split('/')[0].lower() == owner)
          with urllib.request.urlopen('https://api.github.com/repos/' + target, timeout=30) as response:
              assert json.load(response)['private'] is False
      - name: Prepare trusted Python image
        shell: bash
        run: |
          mkdir -p /tmp/devpilot-image
          cat > /tmp/devpilot-image/runner.py <<'PYTHON'
          """Trusted code embedded in the Actions image; runs ONLY inside its container."""

          import json
          import os
          import re
          import subprocess
          import sys
          from pathlib import Path


          def tail(path: str) -> str:
              with open(path, "rb") as stream:
                  stream.seek(0, 2)
                  stream.seek(max(0, stream.tell() - 4000))
                  return stream.read().decode(errors="replace")


          def main() -> None:
              payload = json.loads(sys.stdin.buffer.readline(64000))
              target, ref = payload["target_repo"], payload["target_ref"]
              if not re.fullmatch(r"[A-Za-z0-9][A-Za-z0-9_.-]*/[A-Za-z0-9][A-Za-z0-9_.-]*", target):
                  raise ValueError("invalid repository")
              if not re.fullmatch(r"[0-9a-f]{40}", ref):
                  raise ValueError("immutable SHA required")
              result = {"applied": False, "exit_code": 4, "outcomes": {}, "failure_details": {}}
              Path("/tmp/install.log").touch()
              Path("/tmp/pytest.log").touch()
              try:
                  # Git, package hooks, conftest and pytest all execute in this container.
                  with open("/tmp/install.log", "w") as log:
                      subprocess.run(["git", "init", "/work/repo"], check=True, stdout=log, stderr=log)
                      os.chdir("/work/repo")
                      subprocess.run(
                          ["git", "fetch", "--depth", "1", f"https://github.com/{target}.git", ref],
                          check=True,
                          stdout=log,
                          stderr=log,
                      )
                      subprocess.run(
                          ["git", "-c", "advice.detachedHead=false", "checkout", "--detach", "FETCH_HEAD"],
                          check=True,
                          stdout=log,
                          stderr=log,
                      )
                      paths = list(Path(".").rglob("*"))
                      if any(p.is_symlink() for p in paths):
                          raise ValueError("symlink repositories are unsupported")
                      if (
                          len(paths) > 10000
                          or sum(p.stat().st_size for p in paths if p.is_file()) > 50 * 1024 * 1024
                      ):
                          raise ValueError("repo exceeds limits")
                      diff = payload["diff"]
                      if diff:
                          Path("/tmp/patch.diff").write_text(diff)
                          subprocess.run(
                              ["git", "apply", "--check", "/tmp/patch.diff"],
                              check=True,
                              stdout=log,
                              stderr=log,
                          )
                          changes = subprocess.check_output(
                              ["git", "apply", "--numstat", "/tmp/patch.diff"], text=True
                          ).splitlines()
                          count = 0
                          if len(changes) > 5:
                              raise ValueError("patch exceeds file limit")
                          for entry in changes:
                              added, deleted, name = entry.split("\t")
                              path = Path(name)
                              if (
                                  path.suffix != ".py"
                                  or path.is_absolute()
                                  or ".." in path.parts
                                  or any(
                                      p.startswith(".") or p.lower().startswith("test") for p in path.parts
                                  )
                                  or path.name in {"conftest.py", "setup.py", "noxfile.py", "fabfile.py"}
                                  or path.stem.lower().endswith("_test")
                              ):
                                  raise ValueError("protected patch path")
                              count += int(added) + int(deleted)
                          if count > 200:
                              raise ValueError("patch exceeds changed-line limit")
                          subprocess.run(
                              ["git", "apply", "/tmp/patch.diff"], check=True, stdout=log, stderr=log
                          )
                      result["applied"] = True  # Empty baseline patch is a valid no-op.
                      pip = [
                          sys.executable,
                          "-m",
                          "pip",
                          "install",
                          "--disable-pip-version-check",
                          "--target=/tmp/deps",
                      ]
                      if Path("requirements.txt").is_file():
                          subprocess.run([*pip, "-r", "requirements.txt"], check=True, stdout=log, stderr=log)
                      elif not Path("pyproject.toml").is_file():
                          raise ValueError("requires requirements.txt or pyproject.toml")
                      if Path("pyproject.toml").is_file():
                          import tomllib

                          if "build-system" in tomllib.loads(Path("pyproject.toml").read_text()):
                              subprocess.run([*pip, "."], check=True, stdout=log, stderr=log)
                  # Dependency preparation needs public downloads. The trusted host disconnects
                  # every container network before allowing any pytest import or test hook.
                  print("DEVPILOT_TEST_READY", flush=True)
                  if sys.stdin.buffer.readline(64) != b"continue\n":
                      raise RuntimeError("Network isolation was not acknowledged by the host")
                  sys.path[:0] = ["/tmp/deps", "/work/repo", "/work/repo/src"]
                  import pytest

                  class Reporter:
                      def pytest_runtest_logreport(self, report):
                          if report.failed:
                              result["outcomes"][report.nodeid] = "failed"
                              crash = getattr(report.longrepr, "reprcrash", None)
                              result["failure_details"][report.nodeid] = str(
                                  getattr(crash, "message", report.longrepr)
                              )[-1000:]
                          elif result["outcomes"].get(report.nodeid) != "failed" and (
                              report.when == "call" or report.skipped
                          ):
                              result["outcomes"][report.nodeid] = report.outcome

                      def pytest_collectreport(self, report):
                          if report.failed:
                              result["outcomes"][report.nodeid] = "collection_error"

                  # Redirect even native fd writes into bounded tmpfs logs, not the host.
                  with open("/tmp/pytest.log", "w") as log:
                      saved = os.dup(1), os.dup(2)
                      os.dup2(log.fileno(), 1)
                      os.dup2(log.fileno(), 2)
                      try:
                          result["exit_code"] = int(
                              pytest.main(
                                  ["-q", "--tb=short", "--color=no", "-o", "cache_dir=/tmp/cache"],
                                  plugins=[Reporter()],
                              )
                          )
                      finally:
                          sys.stdout.flush()
                          sys.stderr.flush()
                          os.dup2(saved[0], 1)
                          os.dup2(saved[1], 2)
                          os.close(saved[0])
                          os.close(saved[1])
              except Exception as exc:
                  result["infrastructure_error"] = (
                      f"Sandbox setup failed ({type(exc).__name__}). Inspect install.log."
                  )
              print(
                  json.dumps(
                      {
                          "results": result,
                          "pytest_log": tail("/tmp/pytest.log"),
                          "install_log": tail("/tmp/install.log"),
                      }
                  ),
                  flush=True,
              )


          if __name__ == "__main__":
              main()
          PYTHON
          cat > /tmp/devpilot-image/Dockerfile <<'DOCKER'
          FROM python:3.11-slim
          RUN apt-get update && apt-get install -y --no-install-recommends git && rm -rf /var/lib/apt/lists/* && pip install --no-cache-dir pytest==8.4.2
          COPY runner.py /opt/runner.py
          USER 10001:10001
          WORKDIR /work
          CMD ["python", "-I", "/opt/runner.py"]
          DOCKER
          docker build -q -t devpilot-actions /tmp/devpilot-image
      - name: Apply patch and run pytest inside isolated container
        env:
          TARGET_REPO: ${{ inputs.target_repo }}
          TARGET_REF: ${{ inputs.target_ref }}
        shell: python
        run: |
          import json, os, pathlib, subprocess, tempfile, time, uuid
          output = pathlib.Path('results')
          output.mkdir()
          name = 'devpilot-' + uuid.uuid4().hex
          payload = json.dumps({'target_repo': os.environ['TARGET_REPO'], 'target_ref': os.environ['TARGET_REF'], 'diff': pathlib.Path('patch.diff').read_text()})
          data = {'results': {'applied': False, 'exit_code': 4, 'outcomes': {}, 'infrastructure_error': 'Container failed to produce results.'}, 'pytest_log': '', 'install_log': ''}
          command = ['docker', 'run', '--name', name, '-i', '--read-only', '--user=10001:10001', '--cap-drop=ALL', '--security-opt=no-new-privileges', '--cpus=1', '--memory=512m', '--memory-swap=512m', '--pids-limit=128', '--log-driver=none', '--tmpfs=/work:rw,nosuid,nodev,size=128m,uid=10001,gid=10001', '--tmpfs=/tmp:rw,nosuid,nodev,size=256m,uid=10001,gid=10001', '--env=HOME=/tmp', 'devpilot-actions']
          try:
              with tempfile.TemporaryFile() as captured:
                  process = subprocess.Popen(command, stdin=subprocess.PIPE, stdout=captured, stderr=captured)
                  process.stdin.write((payload + "\n").encode()); process.stdin.flush()
                  deadline = time.monotonic() + 300
                  isolated = False
                  while process.poll() is None:
                      captured.seek(0)
                      if not isolated and b'DEVPILOT_TEST_READY\n' in captured.read(1000000):
                          subprocess.run(['docker', 'network', 'disconnect', 'bridge', name], check=True, capture_output=True)
                          networks = subprocess.check_output(['docker', 'inspect', '--format', '{{json .NetworkSettings.Networks}}', name], text=True).strip()
                          if networks != '{}':
                              raise RuntimeError('Container still has a network attached')
                          process.stdin.write(b'continue\n'); process.stdin.close()
                          isolated = True
                          deadline = time.monotonic() + 120
                      if time.monotonic() >= deadline or os.fstat(captured.fileno()).st_size > 1000000:
                          subprocess.run(['docker', 'kill', name], capture_output=True)
                          process.kill(); process.wait()
                          data['results'].update(exit_code=124, timed_out=True)
                          break
                      time.sleep(.2)
                  else:
                      captured.seek(0)
                      raw = captured.read(1000000).decode(errors='replace').split('DEVPILOT_TEST_READY\n')[-1]
                      try:
                          data = json.loads(raw)
                      except ValueError:
                          data['install_log'] = raw[-4000:]
          finally:
              subprocess.run(['docker', 'rm', '-f', name], capture_output=True)
              (output/'results.json').write_text(json.dumps(data['results']))
              (output/'pytest.log').write_text(data['pytest_log'][-4000:])
              (output/'install.log').write_text(data['install_log'][-4000:])
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results
          retention-days: 1
          path: results/
          if-no-files-found: error
